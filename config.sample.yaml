# Health Check and DNS Update Configuration

# How often to perform health checks
interval: 30s

# List of domains to manage
domains:
  - recordName: "service.example.com"
    provider: "example-provider-1"
    ttl: 120
    healthChecks:
      timeout: "2s"
      attempts: 3
      # Consecutive successes needed to re-add an endpoint that was removed (default 1)
      recoverAfter: 3
      # Request method: GET (default) or HEAD
      method: "HEAD"
      # Status code that means healthy: an exact code or "2xx" (default "2xx")
      expectStatus: "204"
    endpoints:
      - name: "server1"
        url: "http://192.168.1.100:8080/health"
        ip: "192.168.1.100"
      # IPv6 endpoints are published as AAAA records
      - name: "server2-ipv6"
        url: "http://[2001:db8::101]:8080/health"
        ip: "2001:db8::101"
  - recordName: "foo.example.com"
    provider: "example-provider-1"
    ttl: 120
    healthChecks:
      timeout: "5s"
      attempts: 2
    endpoints:
      - name: "foo1"
        url: "http://192.168.1.200:9000/health"
        ip: "192.168.1.200"
      - name: "foo2"
        url: "http://192.168.1.201:9000/health"
        ip: "192.168.1.201"
  - recordName: "app.example.com"
    provider: "example-provider-1"
    ttl: 120
    endpoints:
      # Endpoints have priority 0 by default, and lower values are preferred
      # DNS only contains the healthy endpoints with the lowest priority value
      - name: "primary"
        url: "http://192.168.1.50:8080/health"
        ip: "192.168.1.50"
      # Backup, published only while "primary" is unhealthy
      - name: "backup"
        url: "http://203.0.113.10:8080/health"
        ip: "203.0.113.10"
        priority: 1
  - recordName: "tunnel.example.com"
    provider: "example-provider-1"
    ttl: 120
    endpoints:
      - name: "vps"
        url: "http://192.0.2.10:8080/health"
        ip: "192.0.2.10"
      # Last resort when "vps" is unhealthy, published as a CNAME record
      # A CNAME record can't coexist with other records, so this endpoint is alone in its priority
      # The health check goes through its own url
      - name: "tunnel"
        url: "https://tunnel-health.example.com/health"
        cname: "0a1b2c3d.cfargotunnel.com"
        priority: 1
        # Options for a specific provider, which must be the one used by the domain
        # All endpoints with the same priority must use the same value for proxied
        providerOptions:
          cloudflare:
            # Cloudflare proxies the record (default false)
            proxied: true

  # Dynamic DNS: the record follows the public IP address of the network ddup runs in
  # With no "url" the endpoint isn't health-checked; it's healthy while the lookup works
  # ddup has no built-in lookup service: the services are set in "ipLookupURLs", either at the top level (below) or on the endpoint
  - recordName: "home.example.com"
    provider: "example-provider-1"
    ttl: 300
    endpoints:
      - name: "home"
        # 4 creates an A record, 6 an AAAA record. Use this instead of "ip"
        # This endpoint has no "ipLookupURLs" of its own, so it uses the entries with family 4 in the top-level list
        ipLookupFamily: 4

  # An endpoint can have its own list of services, with one or more entries
  # The list replaces the top-level one for this endpoint (the two are not merged)
  - recordName: "office.example.com"
    provider: "example-provider-1"
    ttl: 300
    endpoints:
      - name: "office"
        ipLookupFamily: 4
        # All the services in the list are asked at the same time and the first valid answer is used
        # A warning is logged if the others return a different address
        # With one entry, only that service is asked
        ipLookupURLs:
          # "family" is optional here; if set, it must be equal to ipLookupFamily
          - url: "https://ip.example.com/v4"
          - url: "https://ip2.example.com/plain"

# Services used to look up the public IP address of the endpoints that have "ipLookupFamily" and no "ipLookupURLs" of their own
# ddup has no built-in services and contacts none that is not configured; the services see the public address of your network
# Each family used by an endpoint needs at least one entry. "family" (4 or 6) defaults to 4 here, and URLs must use https
# The entries for the same family are asked at the same time and the first valid answer is used
ipLookupURLs:
  - url: "https://whatismyip.akamai.com"
    family: 4
  - url: "https://api.ipify.org"
    family: 4
  - url: "https://api6.ipify.org"
    family: 6

# Provider Configuration
providers:
  example-provider-1:
    cloudflare:
      apiToken: "your-cloudflare-api-token"
      zoneId: "your-zone-id"

# Notifications (optional)
# URLs, tokens and connection strings are secrets: instead of writing them here, read them from files, as in `token: !file /run/secrets/ntfy-token`
# Every notification has an optional "events" list, with any of: dns_updated, dns_update_failed, all_unhealthy (default: all of them)
notifications:
  # ntfy topics
  ntfy:
    - name: "alerts"
      # URL of the topic, including the topic name
      url: "https://ntfy.example.com/ddup"
      # Optional access token
      token: "your-ntfy-token"
      events: ["dns_updated", "dns_update_failed", "all_unhealthy"]
      # Allow sending to private addresses, such as a ntfy server in your LAN or cluster (default: false)
      allowPrivateDestinations: true
      # Optional delivery settings. Defaults: timeout 20s, maxAttempts 3 (including the first), retryInterval 20s
      timeout: "10s"
      maxAttempts: 3
      retryInterval: "20s"
  # Webhooks, with the format "plain" (default), "slack", or "discord"
  webhooks:
    - name: "chat"
      format: "slack"
      url: "https://hooks.slack.com/services/your-webhook-path"
      events: ["dns_update_failed", "all_unhealthy"]
  # Email
  email:
    - name: "ops"
      # Connection string for Resend, SMTP (smtp://user:password@host:587?fromAddress=...&tls=starttls), AWS SES, SendGrid, or console://
      connectionString: "resend://your-resend-api-key?fromAddress=ddup@example.com&fromName=ddup"
      # One email is sent to each recipient
      to: ["postmaster@example.com"]
      events: ["dns_update_failed", "all_unhealthy"]
  # Fork extension: add the status emoji, the priority tiers and the error of each unhealthy endpoint to every message (default: true)
  # Set it to false for the shorter messages
  detail: true

# Run more than one replica (Kubernetes only)
# All replicas check health, but only the leader updates DNS and sends notifications
# A Lease named "name" decides the leader
# Standby replicas forward API requests to the leader, so the dashboard shows the leader's view
# Forwarding needs the identity to be the pod's IP address: set POD_IP from the downward API (status.podIP)
# Namespace defaults to the pod's, identity to $POD_IP, then $POD_NAME, then the hostname
# The pod's service account needs get, create and update on the Lease
leaderElection:
  enabled: false
  name: ddup
  # namespace: ""
  # identity: ""

# Enable the web server
server:
  enabled: true
  bind: "127.0.0.1"
  port: 7401
