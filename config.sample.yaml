# Health Check and DNS Update Configuration

# How often to perform health checks
interval: 30s

# List of domains to manage
domains:
  - recordName: "service.example.com"
    provider: "example-provider-1"
    ttl: 120
    healthChecks:
      timeout: "2s"
      attempts: 3
      # Consecutive successes needed to re-add an endpoint that was removed (default 1)
      recoverAfter: 3
      # Request method, GET (default) or HEAD
      method: "HEAD"
      # Status codes that mean healthy: codes, ranges or classes (default ["2xx"])
      expectStatus: ["200", "418"]
    endpoints:
      - name: "server1"
        url: "http://192.168.1.100:8080/health"
        ip: "192.168.1.100"
      # IPv6 endpoints are published as AAAA records
      - name: "server2-ipv6"
        url: "http://[2001:db8::101]:8080/health"
        ip: "2001:db8::101"
  - recordName: "foo.example.com"
    provider: "example-provider-1"
    ttl: 120
    healthChecks:
      timeout: "5s"
      attempts: 2
    endpoints:
      - name: "foo1"
        url: "http://192.168.1.200:9000/health"
        ip: "192.168.1.200"
      - name: "foo2"
        url: "http://192.168.1.201:9000/health"
        ip: "192.168.1.201"

  # Endpoints have priority 0 by default, and lower values are preferred
  # DNS only contains the healthy endpoints with the lowest priority value
  # Endpoints with the same priority are published together
  # An endpoint publishes either an "ip" (A/AAAA record) or a "cname" (CNAME record, which must be alone in its priority)
  # "proxied" and "cname" are supported by the Cloudflare provider only; all endpoints with the same priority must use the same "proxied"
  - recordName: "failover.example.com"
    provider: "example-provider-1"
    ttl: 60
    healthChecks:
      timeout: "5s"
      attempts: 3
      recoverAfter: 3
    endpoints:
      - name: "vps-us"
        url: "https://vps-us.example.com/health"
        ip: "192.0.2.10"
      - name: "vps-eu"
        url: "https://vps-eu.example.com/health"
        ip: "192.0.2.20"
      - name: "tunnel"
        url: "https://tunnel-health.example.com/health"
        cname: "tunnel.example.com"
        proxied: true
        # Backup, published only while the endpoints with priority 0 are unhealthy
        priority: 1

  # Dynamic DNS: the record follows the public IP address of the network ddup runs in.
  # With no "url" the endpoint isn't health-checked; it's healthy while the lookup works
  - recordName: "home.example.com"
    provider: "example-provider-1"
    ttl: 300
    endpoints:
      - name: "home"
        ipLookup:
          # Tried in order; the first that works is used
          urls:
            - "https://api.ipify.org"
            - "https://ipv4.icanhazip.com"
          # 4 or 6: a response with the other version is an error. Use "pattern" for responses that aren't just the IP address
          family: 4

# Provider Configuration
# Any string setting can read secrets from a file instead of the config file:
#   apiToken: !file /run/secrets/cloudflare-token
#   apiToken: !envfile /run/secrets/ddup.env CLOUDFLARE_API_TOKEN
# ddup fails at startup if the file or variable is missing. In webhooks, use "vars" for secrets that go inside a template
providers:
  example-provider-1:
    cloudflare:
      apiToken: "your-cloudflare-api-token"
      zoneId: "your-zone-id"

# Webhooks called on events: dns_updated, dns_update_failed, all_unhealthy (default: all)
# Failed deliveries are retried with exponential backoff
# Without "body", the event is sent as JSON. Otherwise body and header values are Go templates
# with fields .Type .Domain .Time .Status .Healthy .Previous .Endpoints .Error, methods .Subject, .Text, .StatusTag (a ntfy tag) and .StatusEmoji, and funcs join and json
# "vars" are values for the templates, available as .Vars; they can use !file and !envfile, so secrets don't need to be in this file
webhooks:
  - name: "ntfy"
    url: "https://ntfy.example.com/ddup"
    events: ["dns_updated", "all_unhealthy"]
    headers:
      Title: "ddup: {{ .Subject }}"
      # A green, yellow or red circle for the health of the domain (healthy, warning or unhealthy), shown before the title
      Tags: "{{ .StatusTag }}"
      # Urgent when nothing is healthy
      Priority: '{{ if eq .Status "unhealthy" }}high{{ else }}default{{ end }}'
    body: "Healthy: {{ join .Healthy \", \" }}"
    attempts: 5
    timeout: "10s"
  # Email through any HTTP email API; this example uses Resend (https://resend.com/docs/api-reference/emails/send-email)
  # Mailgun, Postmark, SendGrid and similar work the same way: change the url, auth header and JSON fields
  # Using "json" makes sure values are correctly escaped in the JSON body
  - name: "email"
    url: "https://api.resend.com/emails"
    events: ["dns_updated", "dns_update_failed", "all_unhealthy"]
    vars:
      apiKey: !file /run/secrets/email-api-key
      from: "ddup@example.com"
      to: !file /run/secrets/email-to
    headers:
      Authorization: "Bearer {{ .Vars.apiKey }}"
      Content-Type: "application/json"
    body: '{"from": {{ json .Vars.from }}, "to": [{{ json .Vars.to }}], "subject": {{ json (printf "[ddup] %s" .Subject) }}, "text": {{ json .Text }}}'
  # Alternative: Cloudflare Email Service (needs an account entitled to Email Sending; see the README). Replace the entry above with:
  # - name: "email"
  #   url: "https://api.cloudflare.com/client/v4/accounts/your-account-id/email/sending/send"
  #   events: ["dns_updated", "dns_update_failed", "all_unhealthy"]
  #   headers:
  #     Authorization: "Bearer your-api-token"   # token with Account > Email Sending > Edit
  #     Content-Type: "application/json"
  #   body: '{"from": "ddup@example.com", "to": "postmaster@example.com", "subject": {{ json (printf "[ddup] %s" .Subject) }}, "text": {{ json .Text }}}'
  - name: "audit"
    url: "https://hooks.example.com/ddup"

# Run more than one replica (Kubernetes only). All replicas check health, but only the leader updates DNS and sends webhooks.
# A Lease named "name" decides the leader. Standby replicas forward API requests to the leader, so the dashboard shows the leader's view.
# Forwarding needs the identity to be the pod's IP address: set POD_IP from the downward API (status.podIP).
# Namespace defaults to the pod's, identity to $POD_IP, then $POD_NAME, then the hostname.
# The pod's service account needs get, create and update on the Lease.
leaderElection:
  enabled: false
  name: ddup
  # namespace: ""
  # identity: ""

# Enable the web server
server:
  enabled: true
  bind: "127.0.0.1"
  port: 7401
