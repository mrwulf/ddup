# Health Check and DNS Update Configuration

# How often to perform health checks
interval: 30s

# List of domains to manage
domains:
  - recordName: "service.example.com"
    provider: "example-provider-1"
    ttl: 120
    healthChecks:
      timeout: "2s"
      attempts: 3
    endpoints:
      - name: "server1"
        url: "http://192.168.1.100:8080/health"
        ip: "192.168.1.100"
      # IPv6 endpoints are published as AAAA records
      - name: "server2-ipv6"
        url: "http://[2001:db8::101]:8080/health"
        ip: "2001:db8::101"
  - recordName: "foo.example.com"
    provider: "example-provider-1"
    ttl: 120
    healthChecks:
      timeout: "5s"
      attempts: 2
    endpoints:
      - name: "foo1"
        url: "http://192.168.1.200:9000/health"
        ip: "192.168.1.200"
      - name: "foo2"
        url: "http://192.168.1.201:9000/health"
        ip: "192.168.1.201"

# Provider Configuration
# Any provider setting, and "recordName", can read secrets from the environment or a file instead of the config file:
#   apiToken: !env CLOUDFLARE_API_TOKEN
#   apiToken: !file /run/secrets/cloudflare-token
# ddup fails at startup if the variable or file is missing
providers:
  example-provider-1:
    cloudflare:
      apiToken: "your-cloudflare-api-token"
      zoneId: "your-zone-id"

# Enable the web server
server:
  enabled: true
  bind: "127.0.0.1"
  port: 7401
